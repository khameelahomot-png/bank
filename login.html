<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>NovaBank - Login</title>


    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: Arial, sans-serif;
        }
        
        body {
            background: linear-gradient( 135deg, #eef4ff, #f8fafc);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        /* LOGIN BOX */
        
        .login {
            background: white;
            width: 400px;
            padding: 40px;
            border-radius: 18px;
            box-shadow: 0 15px 40px #d8dce5;
        }
        /* LOGO */
        
        .logo {
            text-align: center;
            font-size: 30px;
            margin-bottom: 10px;
        }
        
        .logo span {
            color: #2563eb;
        }
        /* TITLE */
        
        .login h1 {
            text-align: center;
            margin: 20px 0 8px;
        }
        
        .login>p {
            text-align: center;
            color: #777;
            margin-bottom: 30px;
        }
        /* LABEL */
        
        label {
            font-weight: bold;
            font-size: 14px;
        }
        /* INPUT */
        
        input {
            width: 100%;
            padding: 14px;
            margin: 8px 0 20px;
            border: 1px solid #ddd;
            border-radius: 7px;
            font-size: 15px;
        }
        
        input:focus {
            outline: none;
            border-color: #2563eb;
        }
        /* PASSWORD */
        
        .password {
            display: flex;
            gap: 8px;
        }
        
        .password input {
            flex: 1;
        }
        
        .password button {
            height: 45px;
            padding: 0 12px;
            border: 1px solid #ddd;
            background: white;
            border-radius: 7px;
            cursor: pointer;
        }
        
        .password button:hover {
            background: #f1f5f9;
        }
        /* LOGIN BUTTON */
        
        .submit {
            width: 100%;
            padding: 15px;
            background: #2563eb;
            color: white;
            border: none;
            border-radius: 7px;
            font-weight: bold;
            cursor: pointer;
            font-size: 16px;
        }
        
        .submit:hover {
            background: #1d4ed8;
        }
        /* LINKS */
        
        .links {
            text-align: center;
            margin-top: 20px;
        }
        
        .links p {
            margin-bottom: 8px;
            color: #555;
        }
        
        .links a {
            color: #2563eb;
            text-decoration: none;
            font-weight: bold;
        }
        
        .links a:hover {
            text-decoration: underline;
        }
        /* HOME */
        
        .home {
            text-align: center;
            margin-top: 20px;
        }
        
        .home a {
            color: #555;
            text-decoration: none;
        }
        
        .home a:hover {
            color: #2563eb;
        }
        /* MOBILE */
        
        @media (max-width: 500px) {
            .login {
                width: 90%;
                padding: 30px 25px;
            }
        }
    </style>

</head>


<body>


    <div class="login">


        <!-- LOGO -->

        <div class="logo">

            Nova<span>Bank</span>

        </div>


        <!-- TITLE -->

        <h1>

            Welcome Back

        </h1>


        <p>

            Login to your demo account

        </p>


        <!-- LOGIN FORM -->

        <form onsubmit="login(event)">


            <!-- EMAIL -->

            <label>

                Email Address

            </label>


            <input id="username" type="email" placeholder="you@example.com" required>


            <!-- PASSWORD -->

            <label>

                Password

            </label>


            <div class="password">


                <input id="loginPassword" type="password" placeholder="Password" required>


                <button type="button" class="toggle-password" onclick="showPassword('loginPassword', this)">

                    👁

                </button>


            </div>


            <!-- LOGIN -->

            <button type="submit" class="submit">

                Login

            </button>


        </form>


        <!-- SIGN UP -->

        <div class="links">

            <p>

                Don't have an account?

            </p>


            <a href="signup.html">

                Create Account

            </a>

        </div>


        <!-- HOME -->

        <div class="home">

            <a href="index.html">

                ← Back to Home

            </a>

        </div>


    </div>


    <!-- JAVASCRIPT -->

    <script src="bank.js"></script>


</body>

</html>
